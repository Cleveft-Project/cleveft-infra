services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cleveft-postgres
    environment:
      POSTGRES_DB: cleveft
      POSTGRES_USER: ${DB_USER:cleveft_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:cleveft_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: